[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-search-boost"
version = "0.1.0"
description = "Lightweight Python SDK for configuring, simulating, and syncing Boost & Bury ranking controls in Google Cloud Vertex AI Search (Discovery Engine)."
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "google-cloud",
    "vertex-ai-search",
    "discovery-engine",
    "search-ranking",
    "boost-and-bury",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "google-cloud-discoveryengine>=0.11.0,<1.0.0",
    "google-api-core>=2.11.0,<3.0.0",
    "protobuf>=4.21.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vertex_search_boost = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
